# Source: devops-portfolio/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-portfolio
  labels:
    helm.sh/chart: devops-portfolio-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: mi-app
    app.kubernetes.io/version: 1.0.0
    environment: production
  annotations:
    # Fuerza re-deploy cuando cambia el configmap o secret
    checksum/config: 95452e07be962c2fdf981b5a79932744dc5d97f2bfee630687ac7e6fcef77c8f
    checksum/secret: a81d7b129039c27fd972aad6e380f1c47ff058fffe01a1657ac4c917ac40494b
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
        helm.sh/chart: devops-portfolio-0.1.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: mi-app
        app.kubernetes.io/version: 1.0.0
        environment: production
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres-service 5432; do echo "Esperando DB..."; sleep 2; done
      containers:
        - name: backend
          image: "leandroyh456/devops-portfolio:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
