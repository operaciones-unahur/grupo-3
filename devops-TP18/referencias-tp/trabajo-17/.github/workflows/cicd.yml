name: CI/CD Pipeline - Notes App con Trivy Security (3 Fases & TP10B)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  HELM_RELEASE_NAME: mi-app
  K8S_NAMESPACE: devops-portfolio

jobs:
  # =========================================================================
  # FASE 1: BUILD & PACKAGE (Construcción Única y Exportación de Artefacto)
  # =========================================================================
  build-and-package:
    name: "Fase 1: Build & Package (Imagen Inmutable)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./devops-tp12/app/backend

      - name: Exportar imagen a tarball efímero
        run: |
          mkdir -p build-artifacts
          docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o build-artifacts/app-image.tar

      - name: Publicar Artefacto de Imagen
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts/app-image.tar
          retention-days: 1

  # =========================================================================
  # FASE 2: SAST - SEMGREP (TP15)
  # =========================================================================
  semgrep-sast-scan:
    name: "Fase 2: Semgrep SAST"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Instalar jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Ejecutar Semgrep SAST
        run: |
          semgrep scan             --config=p/owasp-top-ten             --config=p/python             --config=p/dockerfile             --config=p/kubernetes             --config=p/terraform             --json             --output=semgrep-report.json             devops-tp12/app devops-tp12/chart devops-tp12

      - name: Resumen de resultados Semgrep
        if: always()
        run: |
          echo "### Auditoría SAST - Semgrep :mag:" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Findings | $(jq '.results | length' semgrep-report.json 2>/dev/null || echo 0) |" >> $GITHUB_STEP_SUMMARY
          echo "| Motor | Semgrep SAST |" >> $GITHUB_STEP_SUMMARY
          echo "| Política | Andon Cord para ERROR |" >> $GITHUB_STEP_SUMMARY

      - name: Publicar Artifact Semgrep
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 14

      - name: Andon Cord Semgrep - Bloquear ERROR
        run: |
          semgrep scan             --config=p/owasp-top-ten             --severity=ERROR             --error             devops-tp12/app devops-tp12/chart

  # =========================================================================
  # FASE 2A: AUDITORÍA DE SEGURIDAD - ANDON CORD (HIGH/CRITICAL)
  # =========================================================================
  gitleaks-andon-cord:
    name: "Fase 2A: Gitleaks - Andon Cord (Secret Detection)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código (Historial completo para análisis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de Secretos con Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Resumen de Andon Cord en GitHub
        if: always()
        run: |
          echo "### Auditoría de Secretos (Gitleaks) :key:" >> $GITHUB_STEP_SUMMARY
          echo "| Evaluación | Tipo de Control | Acción en Pipeline |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-----------------|--------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Fuga de Secretos** | **Andon Cord Activo** | Bloquea el merge si se detectan credenciales |" >> $GITHUB_STEP_SUMMARY

  gitleaks-audit-report:
    name: "Fase 2B: Gitleaks - Reporte e Inspección (Artifacts)"
    runs-on: ubuntu-latest
    needs: [build-and-package, gitleaks-andon-cord]
    if: always()
    steps:
      - name: Checkout del código (Historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalación de Gitleaks CLI
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Generar Reporte de Auditoría en JSON
        run: |
          gitleaks detect --source . --report-format json --report-path gitleaks-report.json || true

      - name: Publicar Artifact de Auditoría de Secretos
        uses: actions/upload-artifact@v4
        with:
          name: reporte-fuga-secretos-gitleaks
          path: gitleaks-report.json
          retention-days: 14

      - name: Publicar Resumen en $GITHUB_STEP_SUMMARY
        run: |
          echo "### Reporte de Inspección de Secretos (Gitleaks) :clipboard:" >> $GITHUB_STEP_SUMMARY
          echo "El informe JSON detallado de auditoría de Git se ha adjuntado como **Artifact**." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          head -n 30 gitleaks-report.json || echo "[]" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  trivy-andon-cord:
    name: "Fase 2A: Trivy - Andon Cord (HIGH/CRITICAL)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      # -------------------------------------------------------------
      # APLICACIÓN PATRÓN TP10B: Renderizado previo de Helm
      # -------------------------------------------------------------
      - name: Renderizar Helm Chart (TP10B - Sin Falsos Positivos)
        run: |
          helm template ${{ env.HELM_RELEASE_NAME }} ./devops-tp12/chart -f devops-tp12/chart/values-prod.yaml > manifests-rendered-prod.yaml

      - name: Escaneo de Contenedor & SCA (Andon Cord)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Escaneo de IaC sobre YAML Renderizado (Trivy Config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'manifests-rendered-prod.yaml'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Resumen de Andon Cord en GitHub
        if: always()
        run: |
          echo "### Auditoría Bloqueante de Seguridad (Andon Cord) :shield:" >> $GITHUB_STEP_SUMMARY
          echo "| Evaluación | Severidades | Política de Control |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------------|---------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Contenedor, SCA e IaC Renderizado** | \`HIGH, CRITICAL\` |  **Andon Cord Activo** (Bloquea si hay CVEs) |" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # FASE 2B: AUDITORÍA DE SEGURIDAD - REPORTE INFORMATIVO (LOW/MEDIUM)
  # =========================================================================
  trivy-audit-report:
    name: "Fase 2B: Trivy - Reporte e Inspección (LOW/MEDIUM)"
    runs-on: ubuntu-latest
    needs: [build-and-package, trivy-andon-cord]
    if: always()
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Escaneo de Seguridad - Reporte Informativo
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'LOW,MEDIUM'
          output: 'trivy-low-medium-report.txt'

      - name: Publicar Artifact de Vulnerabilidades Menores
        uses: actions/upload-artifact@v4
        with:
          name: reporte-vulnerabilidades-trivy-low-medium
          path: trivy-low-medium-report.txt
          retention-days: 14

      - name: Publicar Resumen en $GITHUB_STEP_SUMMARY
        run: |
          echo "### Reporte de Vulnerabilidades Informativas (LOW/MEDIUM) :clipboard:" >> $GITHUB_STEP_SUMMARY
          echo "El reporte completo ha sido adjuntado como **Artifact** descargable en este workflow." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          head -n 35 trivy-low-medium-report.txt || echo "No se registraron vulnerabilidades menores." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # FASE 3: RELEASE & DEPLOY (Publicación y Despliegue Post-Aprobación)
  # =========================================================================
  deploy-k8s-helm:
    name: "Fase 3: Release & Deploy Helm K8s"
    runs-on: ubuntu-latest
    needs: [build-and-package, semgrep-sast-scan, gitleaks-andon-cord, gitleaks-audit-report, trivy-andon-cord, trivy-audit-report]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker probada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y Push a Docker Hub
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Despliegue con Helm en Kubernetes
        run: |
          echo "Desplegando Helm Chart '${{ env.HELM_RELEASE_NAME }}' en namespace '${{ env.K8S_NAMESPACE }}'..."
          # helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./devops-tp12/chart -n ${{ env.K8S_NAMESPACE }}
