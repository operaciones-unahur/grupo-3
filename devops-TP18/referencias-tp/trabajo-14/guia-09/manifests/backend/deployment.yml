# ============================================
# deployment.yml — Backend Flask
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-portfolio
  labels:
    app: backend
    tier: api
spec:
  replicas: 2               # 2 réplicas para alta disponibilidad
  selector:
    matchLabels:
      app: backend
  # Estrategia de update: reemplaza pods de a 1 sin downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # puede crear 1 pod extra durante el update
      maxUnavailable: 0     # nunca baja el total por debajo de replicas
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      # Esperar a que Postgres esté listo antes de arrancar
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Esperando Postgres..."
                sleep 2
              done
              echo "Postgres listo"
      containers:
        - name: backend
          image: TU_USUARIO/devops-portfolio:latest
          ports:
            - containerPort: 5000
          # Variables no sensibles desde ConfigMap
          envFrom:
            - configMapRef:
                name: backend-config
          # Variables sensibles desde Secret
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          # Healthchecks
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
