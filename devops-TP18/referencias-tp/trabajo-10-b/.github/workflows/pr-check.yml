name: PR Check - Validación de Calidad y Helm Chart

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Linting Python & Tests Unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de test
        run: |
          pip install flake8 pytest pytest-cov PyYAML

      - name: Linting de código Python (Flake8)
        run: |
          flake8 backend/ --max-line-length=120

      - name: Ejecutar Pruebas Unitarias
        run: |
          pytest backend/tests/

  helm-validation:
    name: Validar y Renderizar Helm Chart (Render First)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Validar estructura y metadata del Chart (Helm Lint)
        run: |
          helm lint devops-portfolio/

      # -------------------------------------------------------------
      # PASO CLAVE TP10B: Renderizado previo de plantillas con values
      # -------------------------------------------------------------
      - name: Renderizar Plantillas Go a YAML puro de Kubernetes
        run: |
          helm template mi-app ./devops-portfolio -f devops-portfolio/values-prod.yaml > manifests-rendered-prod.yaml

      - name: Validar Sintaxis YAML del Manifiesto Renderizado
        run: |
          python3 -c "
          import yaml
          with open('manifests-rendered-prod.yaml') as f:
              docs = list(yaml.safe_load_all(f))
              print(f'[OK] Se procesaron correctamente {len(docs)} objetos de K8s.')
          "

      - name: Publicar Artefacto con los Manifiestos Renderizados
        uses: actions/upload-artifact@v4
        with:
          name: manifiestos-k8s-renderizados
          path: manifests-rendered-prod.yaml
          retention-days: 7
